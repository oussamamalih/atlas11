services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas11-app
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: Atlas11
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: atlas11
      DB_USERNAME: atlas11
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr

  mysql:
    image: mysql:8.4
    container_name: atlas11-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: atlas11
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: atlas11
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: