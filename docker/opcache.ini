; Atlas11 development OPcache settings for Docker Desktop on Windows.
;
; validate_timestamps is DISABLED to eliminate the per-request file
; stat/timestamp validation that, on a Windows Docker bind mount
; (~1ms per stat vs ~0.0005ms on a native filesystem), caused
; 1.1-1.4s stalls on every request after the revalidation window.
;
; IMPORTANT (local development only):
;   After changing PHP or Blade files you must restart the container:
;       docker compose restart app
;   This configuration is for local development ONLY. Production must
;   keep opcache.validate_timestamps=1 (or deploy with an explicit
;   immutable image + a deploy-time build).
opcache.validate_timestamps=0
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000